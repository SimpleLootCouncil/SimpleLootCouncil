name: Bug report
description: Something in SimpleLootCouncil went wrong
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: SLC version
      description: Shown at the top right of the `/slc` settings window, in `/slc version`, or in WowUp.
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game
      options:
        - Retail
        - WoW Forever
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role when it happened
      options:
        - Loot Master
        - Council member
        - Raider
        - Solo / testing
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: /slc log
      description: Type `/slc log level verbose` in game, make the problem happen again, then type `/slc log` and paste what it shows. `/slc log level quiet` turns the extra logging off again. Any Lua error text (BugSack) helps too.
      render: text
